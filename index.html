<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brotato-like - Multijoueur Local</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Écran de sélection de personnages -->
    <div id="characterSelectScreen" class="screen active">
        <h1>SÉLECTION PERSONNAGE</h1>
        <div class="character-select-container">
            <div class="player-slots">
                <!-- Les slots de joueurs seront générés par JS -->
            </div>
            <div class="character-info">
                <div class="char-sprite-small">
                    <img src="sprites/The mad/themad.png" alt="The Mad">
                </div>
                <div class="char-description">
                    <h2>THE MAD</h2>
                    <p>PASSIF: +10% ALL STATS</p>
                    <p>ATK SPD: +50%</p>
                </div>
            </div>
        </div>
        <div class="start-btn-container">
            <button id="startGameBtn">START GAME</button>
        </div>
    </div>

    <!-- Menu entre les vagues -->
    <div id="waveMenuScreen" class="screen">
        <h1>WAVE COMPLETE</h1>
        <div class="wave-timer-display">WAVE: <span id="waveMenuWaveNum">1</span>/10</div>
        
        <div class="menu-tabs">
            <button class="tab-btn active" data-tab="stats">STATS UPGRADE</button>
            <button class="tab-btn" data-tab="character">CHARACTER INFO</button>
        </div>
        
        <div class="menu-content">
            <!-- Onglet Stats -->
            <div class="tab-content active" id="statsTab">
                <div class="upgrade-container">
                    <h3>CHOOSE UPGRADE</h3>
                    <div class="upgrade-options">
                        <div class="upgrade-option" data-stat="pv">
                            <img src="sprites/hud/stats/PV.png" alt="PV">
                            <span>+2 HP</span>
                        </div>
                        <div class="upgrade-option" data-stat="damage">
                            <img src="sprites/hud/stats/damage.png" alt="DMG">
                            <span>+1 DMG</span>
                        </div>
                        <div class="upgrade-option" data-stat="as">
                            <img src="sprites/hud/stats/as.png" alt="AS">
                            <span>+5% ATK SPD</span>
                        </div>
                        <div class="upgrade-option" data-stat="magic">
                            <img src="sprites/hud/stats/Magiquedamage.png" alt="MAGIC">
                            <span>+1 MAGIC DMG</span>
                        </div>
                        <div class="upgrade-option" data-stat="resistance">
                            <img src="sprites/hud/stats/resistance.png" alt="RES">
                            <span>+2% RES</span>
                        </div>
                        <div class="upgrade-option" data-stat="crit">
                            <img src="sprites/hud/stats/crit.png" alt="CRIT">
                            <span>+1% CRIT</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Onglet Character -->
            <div class="tab-content" id="characterTab">
                <div class="character-stats-display">
                    <img src="sprites/The mad/themad.png" alt="Character">
                    <div class="stats-list">
                        <div class="stat-item">
                            <img src="sprites/hud/stats/PV.png" alt="PV">
                            <span id="playerHPDisplay">10</span>
                        </div>
                        <div class="stat-item">
                            <img src="sprites/hud/stats/damage.png" alt="DMG">
                            <span id="playerDmgDisplay">5</span>
                        </div>
                        <div class="stat-item">
                            <img src="sprites/hud/stats/as.png" alt="AS">
                            <span id="playerASDisplay">0%</span>
                        </div>
                        <div class="stat-item">
                            <img src="sprites/hud/stats/crit.png" alt="CRIT">
                            <span id="playerCritDisplay">0%</span>
                        </div>
                        <div class="stat-item">
                            <img src="sprites/hud/stats/resistance.png" alt="RES">
                            <span id="playerResDisplay">0%</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <button id="nextWaveBtn">NEXT WAVE</button>
    </div>

    <!-- Écran de jeu -->
    <div id="gameScreen" class="screen">
        <canvas id="gameCanvas"></canvas>
        
        <!-- HUD -->
        <div id="hud">
            <div id="waveTimer">WAVE: 1/10 | TIME: 60s</div>
            <div id="playerHUDs">
                <!-- Player HUDs générés par JS -->
            </div>
        </div>
    </div>

    <!-- Écran de fin -->
    <div id="endScreen" class="screen">
        <h1 id="endTitle">GAME OVER</h1>
        <div id="endStats"></div>
        <button id="restartBtn">RESTART</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
