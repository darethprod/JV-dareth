<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>THE MAD</title><link rel="stylesheet" href="styles.css"></head>
<body>
<main>
<section id="screen-character" class="screen active">
  <div class="menu-art character-art">
    <img class="menu-frame" src="sprites/hud/menu/selectiondepsersonnage.png" alt="">
    <div class="character-ui">
      <div class="champion-box"><img id="champion-preview" src="sprites/The mad/themad.png" alt="The Mad"></div>
      <div class="champion-name">THE MAD</div>
      <div class="passive">ALL STATS +10%<br>ATTACK SPEED +50%</div>
    </div>
    <div id="player-slots" class="player-slots"></div>
    <button id="start-btn" class="start-button">START</button>
  </div>
</section>
<section id="screen-game" class="screen"><canvas id="game"></canvas><div class="hud"><div class="topbar"><span id="wave">WAVE 1/10</span><b id="timer">01:00</b><span id="alive">ENEMIES 0</span></div><div id="player-hud" class="player-hud"></div></div></section>
<section id="screen-upgrade" class="screen overlay-screen">
 <div class="menu-art wave-art">
   <img class="menu-frame" src="sprites/hud/menu/menuentrelesvagues.png" alt="">
   <div class="upgrade-ui">
    <div class="tabs"><button id="tab-wave" class="tab active">WAVE</button><button id="tab-character" class="tab">CHARACTER</button></div>
    <div id="upgrade-grid" class="upgrade-grid"></div>
    <div class="controller-hint">LB / RB · TAB</div>
   </div>
 </div>
</section>
<section id="screen-win" class="screen overlay-screen"><div class="result"><h1>VICTORY</h1><p>10 WAVES</p><button id="again-win" class="start-button">PLAY AGAIN</button></div></section>
<section id="screen-lose" class="screen overlay-screen"><div class="result"><h1>DEFEAT</h1><p id="lose-text"></p><button id="again-lose" class="start-button">PLAY AGAIN</button></div></section>
</main><script src="game.js"></script>
</body></html>
