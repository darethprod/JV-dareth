<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Defense</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Menu Principal -->
    <div id="main-menu" class="menu-bois">
        <h1>TOWER DEFENSE</h1>
        <button id="btn-jouer">JOUER</button>
    </div>

    <!-- Interface de Jeu -->
    <div id="game-container" style="display: none;">
        <!-- HUD - Barre de vie joueur (centre haut) -->
        <div id="player-lifebar">
            <span id="player-hp">100</span>/100
        </div>

        <!-- HUD - Monnaie (haut gauche) -->
        <div id="money-display">
            <img src="assets/hud/billet.png" alt="$">
            <span id="money-amount">0</span>
        </div>

        <!-- HUD - Menu des unités (haut gauche, sous la monnaie) -->
        <div id="unit-menu">
            <img src="assets/hud/menudesunité.png" alt="Menu Unités">
            <div id="tower-slot" class="tower-slot" data-tower="proletaire">
                <img src="assets/towers/proletaire/tour.png" alt="Prolétaire">
                <span class="tower-cost">50</span>
            </div>
        </div>

        <!-- Zone de Jeu -->
        <canvas id="game-canvas"></canvas>
    </div>

    <script src="js/game.js"></script>
</body>
</html>
